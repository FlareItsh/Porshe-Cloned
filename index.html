<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche</title>
    <link href="https://fonts.cdnfonts.com/css/911-porscha" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cce20cf791.js" crossorigin="anonymous"></script>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body class="relative min-h-screen text-white">

    <!-- Hero Background Image (Fix: -z-20 behind bg-black was hiding it, now positioned properly) -->
    <div class="fixed inset-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
        <img src="./images/hero-bg.jpg" alt="Porsche Hero" class="w-full h-full object-cover object-top">
        <div class="absolute inset-0 bg-black/40"></div>
    </div>

    <!-- Navigation -->
    <nav class="px-6 md:px-20 py-4 shadow-2xl text-white bg-black/30 backdrop-blur-md sticky top-0 w-full z-50">
        <ul class="flex justify-between items-center">
            <li>
                <button id="menu-btn" class="flex items-center gap-2 text-sm uppercase tracking-widest hover:text-gray-300 transition-colors cursor-pointer">
                    <i class="fa-solid fa-bars"></i>
                    <span>Menu</span>
                </button>
            </li>
            <li>
                <a href="#" class="font-primary text-2xl font-bold tracking-widest uppercase hover:opacity-90 transition-opacity" style="font-family: '911 Porscha', sans-serif;">PORSCHE</a>
            </li>
            <li>
                <a href="#" aria-label="User Account" class="hover:text-gray-300 transition-colors">
                    <i class="fa-regular fa-user text-lg"></i>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <main class="px-6 md:px-20 lg:px-40 h-[calc(100vh-5rem)] flex flex-col justify-center items-start">
        <h1 class="text-white text-4xl sm:text-6xl lg:text-7xl max-w-4xl font-light leading-tight drop-shadow-2xl" style="font-family: '911 Porscha', sans-serif;">
            Some feelings never fade.
        </h1>
        <div class="mt-8">
            <button class="border-2 text-white px-6 py-4 border-white rounded-md hover:bg-white hover:text-black transition-all ease-in-out duration-200 cursor-pointer">
                Porsche. There is no substitute.
            </button>
        </div>
    </main>

    <!-- Showcase Section -->
    <section class="min-h-screen px-6 md:px-20 lg:px-40 py-24 flex flex-col justify-center items-center bg-black/80 backdrop-blur-sm">
        <div class="relative max-w-md w-full rounded-3xl overflow-hidden shadow-2xl group cursor-pointer border border-neutral-800">
            <img src="./images/911gt3rs.jpg" alt="Porsche 911 GT3 RS" class="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
            <p class="absolute bottom-6 left-6 text-2xl font-bold tracking-wider text-white" style="font-family: '911 Porscha', sans-serif;">
                911 GT3 RS
            </p>
        </div>
    </section>

    <!-- Custom Scripts -->
    <script src="./js/main.js"></script>
</body>
</html>
